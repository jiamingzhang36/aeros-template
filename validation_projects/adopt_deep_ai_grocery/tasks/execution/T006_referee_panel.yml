task_id: T006_referee_panel
stage: execution
gate: G8
depends_on: [T005_claim_audit]
goal: >
  Simulate methods, domain, policy, and skeptical-editor objections after the
  design, result, and claim audits exist. Produce objections and response
  options without editing the manuscript.

inputs:
  - paper/
  - docs/method_card.md
  - docs/protected_definitions.yml
  - evidence/claim_registry.md
  - audits/

allowed_outputs:
  - audits/referee_panel_report.md
  - agent_runs/

forbidden_actions:
  - "Do not rewrite the paper."
  - "Do not decide which objections must be accepted."
  - "Do not change claims, methods, or protected definitions."

checks:
  - check_protected_definitions.py
  - check_claim_registry.py
  - check_agent_run_report.py

retry_policy:
  max_retries: 1

escalate_if:
  - "proposed revisions affect design or claim strength"
  - "checks still fail after max_retries"

budget:
  max_agent_calls: 2
  max_dollars: 1.0
  timeout_seconds: 480
