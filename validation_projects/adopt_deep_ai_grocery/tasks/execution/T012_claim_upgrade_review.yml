task_id: T012_claim_upgrade_review
stage: execution
gate: G12
depends_on: [T011_expanded_result_validation]
goal: >
  Review whether the expanded G11 evidence can justify proposing a bounded
  upgrade to the active measurement claim. The task may recommend options, but
  it must not mark any claim supported or approve stronger paper language.

inputs:
  - evidence/claim_registry.md
  - evidence/result_index.csv
  - outputs/tables/expanded_measurement_summary.csv
  - outputs/tables/expanded_robustness_summary.csv
  - audits/expanded_result_validation_report.md
  - paper/draft.md

allowed_outputs:
  - audits/claim_upgrade_review_report.md
  - agent_runs/

forbidden_actions:
  - "Do not mark C002 supported."
  - "Do not edit the paper draft."
  - "Do not approve final conclusions or submission."
  - "Do not modify protected definitions."

checks:
  - check_claim_upgrade_review.py
  - check_claim_registry.py
  - check_output_reproducibility.py
  - check_provenance.py
  - check_agent_run_report.py

retry_policy:
  max_retries: 1

escalate_if:
  - "claim upgrade requires human approval"
  - "expanded evidence is insufficient for supported status"
  - "checks still fail after max_retries"

budget:
  max_agent_calls: 2
  max_dollars: 1.0
  timeout_seconds: 480
