task_id: D002_data_scouting
stage: discovery
depends_on: []
gate: G1
automation_class: receipt_audited
evidence_receipt_required: true
receipt_path: evidence/receipts/D002_data_scouting_human_review_receipt.md
gate_status: needs_receipt_audit
goal: 'Scout candidate data sources that could support the project''s research question
  and register each as one row in discovery/data_inventory.csv. This is a DISCOVERY
  task: locate sources and record their access path, engineering status, and the next
  probe needed. Do not download data, do not claim a source is feasible, and do not
  write any data files.

  '
inputs:
- discovery/01_literature_scope.md
- discovery/idea_memo.md
- project_manifest.yml
allowed_outputs:
- discovery/data_inventory.csv
forbidden_actions:
- Do not write anywhere under data/raw/ (enforced by a hook; it will be blocked).
- Do not download or store any dataset; record locators and access paths only.
- Do not set feasibility_status to 'pursue' for any source at scouting stage; use
  'TBD'.
- Do not claim a source is accessible without recording access_evidence; otherwise
  record a next_probe.
- Data-source existence is not data feasibility. State the next probe, do not collapse
  it into a verdict.
output_contract:
  inventory_path: discovery/data_inventory.csv
  required_columns:
  - data_id
  - dataset_name
  - owner_or_source
  - access_status
  - unit
  - intake_ref
  - intake_priority
  - geography
  - period
  - key_variables
  - link_or_path
  - restrictions
  - access_evidence
  - engineering_status
  - skills_considered
  - skills_used
  - skill_probe_status
  - next_probe
  - feasibility_status
  - notes
checks:
- check_data_inventory.py
retry_policy:
  max_retries: 2
escalate_if:
- fewer than 3 candidate data sources registered
- checks still fail after max_retries
budget:
  max_agent_calls: 3
  max_dollars: 2.0
