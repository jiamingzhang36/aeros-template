task_id: D005_data_probe
stage: discovery
gate: G1
depends_on: [D002_data_scouting]
goal: >
  G1 Data Readiness. Instantiate and run the project-specific data probe to
  measure real diagnostics and write discovery/data_diagnostics.yml with
  status: measured.

  This is NOT an agent task after instantiation -- run the deterministic probe
  script and make sure every metric referenced by design_options.md viability
  tests is measured numerically.

inputs:
  - discovery/data_inventory.csv
  - code/01_ingest/probe_data_diagnostics.py

allowed_outputs:
  - discovery/data_diagnostics.yml

run:
  command:
    - "python3"
    - "code/01_ingest/probe_data_diagnostics.py"
  cwd: "."

forbidden_actions:
  - "Do not write anywhere under data/raw/."
  - "Do not fabricate diagnostic values; instantiate and run the probe script to measure them."

checks:
  - check_data_diagnostics.py

retry_policy:
  max_retries: 0

budget:
  max_agent_calls: 0
  max_dollars: 0.0
