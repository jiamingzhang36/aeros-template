task_id: D001a_framing
stage: discovery
depends_on: []
gate: G0
automation_class: auto_rerunnable
evidence_receipt_required: false
receipt_path: ''
gate_status: pending
goal: "REASONING step, not a search. Given the research idea, reason about which literature\
  \ FRAMEWORKS this idea draws on, organized by function bucket, and write them to\
  \ discovery/literature/framing_deck.yml as a deck of cards.\nA research idea rests\
  \ on three kinds of literature that share NO topic keywords with each other: substantive/topic\
  \ (gap-verification, background-institutional, data-measurement), method/identification\
  \ frameworks (e.g. policy diffusion, event study, difference-in-differences), and\
  \ theory/mechanism frameworks (e.g. regulatory capture, entry deterrence). A topic\
  \ keyword search only reaches the first kind. Your job here is the intellectual\
  \ bridge the keyword search cannot do: name the method and theory frameworks this\
  \ idea needs, and why.\nProduce framing_deck.yml with this schema:\n\n  idea: \"\
  <one-line restatement of the research question>\"\n  cards:\n    - id: F01\n   \
  \   function: theory-mechanism      # one of: idea-inspiring | gap-verification\
  \ |\n                                       #   method-identification | data-measurement\
  \ |\n                                       #   background-institutional | theory-mechanism\n\
  \      framework: \"Regulatory capture / political economy of regulation\"\n   \
  \   rationale: \"Why this framework applies to THIS idea (>= 1 full sentence).\"\
  \n      role: mechanism-tested           # HOW the paper uses it, one of:\n    \
  \                                   #   motivation | mechanism-tested |\n      \
  \                                 #   identification-threat | measurement-strategy\
  \ |\n                                       #   robustness-comparison\n      caveat:\
  \ \"The threat or limit this framework raises for THIS design (>= 1 sentence).\"\
  \n      decision: proposed               # always 'proposed'; the human sets keep/drop\n\
  \      anchors:\n        - author: \"Stigler\"\n        year: 1971\n        title:\
  \ \"The Theory of Economic Regulation\"\n        openalex_id: \"\"             \
  \ # optional here; D001b resolves pending anchors\n        doi: \"\"           \
  \           # optional here; D001b resolves pending anchors\n        verification_status:\
  \ pending # pending | verified\n        kind: theory                 # empirical\
  \ | review | theory | method | data\n\nRules for the deck: - You MUST propose at\
  \ least one card for each of: gap-verification,\n  method-identification, theory-mechanism\
  \ (the buckets a keyword search leaves\n  empty and the whole point of this step).\
  \ Cover other buckets when relevant.\n- Every card needs a `role` (how the paper\
  \ USES the framework, not just that it\n  is related) and a `caveat` (the threat/limit\
  \ it raises). A framework can be a\n  threat to identification (e.g. policy diffusion\
  \ -> endogenous treatment timing,\n  Manski reflection problem), not only a method\
  \ to borrow.\n- gap-verification MUST name >= 1 EMPIRICAL closest rival candidate\
  \ (anchor kind=empirical):\n  the paper(s) most likely to make THIS study redundant.\
  \ A review or perspective is\n  NOT a closest rival; do not use one to fill the\
  \ gap bucket. Do NOT pad the gap\n  bucket with analogies to hit a count -- if the\
  \ genuine closest-rival set is one\n  paper, name one. Analogies from adjacent regulated\
  \ industries belong in\n  background-institutional, not gap-verification.\n- This\
  \ is a fast framing task, not the verification/search task. Do NOT call\n  OpenAlex\
  \ here. Set verification_status: pending unless you already know a\n  real DOI/OpenAlex\
  \ ID from the input context. D001b will verify and register\n  anchors.\n"
inputs:
- discovery/idea_memo.md
- discovery/01_literature_scope.md
- project_manifest.yml
allowed_outputs:
- discovery/literature/framing_deck.yml
forbidden_actions:
- Do not write anywhere under data/raw/ (enforced by a hook).
- Do not enumerate a full paper list or write paper_registry.csv; this step names
  frameworks + seminal anchors only.
- 'Do not call OpenAlex in this task. Name plausible anchor candidates with verification_status:
  pending; D001b handles verification and registration.'
- Do not set any card's decision to keep or drop; leave it 'proposed' for the human
  gate.
checks:
- check_framing_deck.py
retry_policy:
  max_retries: 2
escalate_if:
- any required bucket (gap-verification, method-identification, theory-mechanism)
  has no card
- checks still fail after max_retries
budget:
  max_agent_calls: 3
  max_dollars: 4.0
  timeout_seconds: 900
