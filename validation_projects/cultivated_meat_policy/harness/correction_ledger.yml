# AEROS correction ledger — the harness's evolving institutional memory.
#
# Each error -> root cause -> lesson -> constraint is recorded here once, and
# agent-lesson entries are injected into future agent prompts (by scope) so the
# same mistake is not repeated. This turns the manual "纠错进化约束" loop into a
# built-in mechanism: constraints accumulate and tighten over time, while the
# model stays free to propose new candidates.
#
# Fields:
#   id           unique C###
#   date         when the correction was made
#   type         agent-lesson (injected into prompts) | runtime-fix (recorded only)
#   scope        tags matched against a contract's correction_scopes (e.g. discovery, all)
#   symptom      what went wrong
#   root_cause   why
#   lesson       the injectable instruction (imperative, agent-facing)
#   enforced_by  a check/contract that now enforces it, or 'prompt-only'

corrections:
  - id: C001
    date: "2026-05-30"
    type: agent-lesson
    scope: [discovery, all]
    symptom: "gap-verification bucket padded with analogy papers to hit a count floor"
    root_cause: "a >=2 empirical-gap-rival floor pressured padding when the genuine closest-rival set was one paper"
    lesson: "Do not pad gap-verification with analogies to hit a count. Name only genuine closest rivals (>=1 is fine when the gap is wide); put adjacent-industry analogies in background-institutional, not gap-verification."
    enforced_by: check_framing_deck.py

  - id: C002
    date: "2026-05-30"
    type: agent-lesson
    scope: [discovery, all]
    symptom: "agent invented evidence_basis='framing_deck', outside the controlled vocabulary"
    root_cause: "the controlled vocabulary was not stated and the agent had no field for deck provenance"
    lesson: "Use only the controlled vocabulary for each field (evidence_basis: none|title|abstract|full_text|extraction_card). Put provenance like 'anchor from framing_deck' in the notes column, never in a vocabulary field."
    enforced_by: check_literature_registry.py

  - id: C003
    date: "2026-05-30"
    type: agent-lesson
    scope: [discovery, all]
    symptom: "framing/design asserted an aggressive causal claim (causal staggered-DiD on firm investment) before any data could earn it"
    root_cause: "treated claim strength as something to declare/default, biased toward prestige causal claims, instead of something earned by the surviving design + data"
    lesson: "Claim strength is EARNED by the selected design and the data, never declared or defaulted. Default to the weakest claim the evidence can support (descriptive before associational before causal); ratchet a claim up only when a design's identifying assumptions AND the data credibly earn it; never claim beyond the evidence. You MAY propose ambitious designs (e.g. causal) as candidates to test against data, but the CLAIM follows what the data adjudicates, not the ambition. Carry each candidate's maximum-supportable claim, not a committed one."
    enforced_by: prompt-only

  - id: C004
    date: "2026-05-30"
    type: agent-lesson
    scope: [discovery, all]
    symptom: "produced a single committed design before any data was in hand"
    root_cause: "empirical design is data-contingent but the step treated one design as final"
    lesson: "Empirical design is data-contingent. Offer ranked candidate designs, each guarded by a checkable data-viability condition, plus an always-viable fallback floor; let the data adjudicate which is used. Do not commit to one design upfront."
    enforced_by: check_design_options.py

  - id: C005
    date: "2026-05-30"
    type: agent-lesson
    scope: [discovery, all]
    symptom: "seminal anchors named in framing were not all registered downstream"
    root_cause: "no recall floor tying the framing deck to the registry"
    lesson: "Every seminal anchor you name in framing MUST be registered downstream (carry its DOI/title). The anchors are the recall floor, not optional."
    enforced_by: check_anchors_in_registry.py

  - id: C006
    date: "2026-05-30"
    type: agent-lesson
    scope: [discovery, all]
    symptom: "risk of confidently naming papers that do not exist or are mis-attributed"
    root_cause: "reasoning steps name canonical papers from memory, which can be wrong"
    lesson: "Verify every named paper/anchor against the OpenAlex API and record a real locator (openalex_id or doi). If you cannot verify it, drop it rather than guess. Never fabricate a citation."
    enforced_by: check_framing_deck.py

  - id: C007
    date: "2026-05-30"
    type: runtime-fix
    scope: [runtime]
    symptom: "a single agent call ran ~22 min and could overshoot the dollar budget; killed child agents were respawned by the retry loop, leaving orphans"
    root_cause: "no per-call cost cap; 30-min timeout; killing children not parents"
    lesson: "Per-call hard cost cap via claude --max-budget-usd; 8-min agent timeout; kill the kernel parent before child agents."
    enforced_by: aeros/runtime/agent.py

  - id: C008
    date: "2026-05-31"
    type: agent-lesson
    scope: [all]
    symptom: "G6 check_paper_numbers reported a discrepancy (140 vs 136 bills) that was a false alarm: AEROS compared the paper against the wrong data file (sample_minimal path) instead of the canonical corpus file"
    root_cause: "G6/check_paper_numbers does not know WHICH file is the canonical source for each paper number — it searched any available CSV and picked the wrong denominator (severity-ladder sample vs full corpus)"
    lesson: "When checking paper numbers against data files, always verify WHICH file is the canonical source for that specific number. A research corpus can have multiple valid denominators (full corpus, estimation sample, risk set) that are all correct but serve different roles. Before flagging a discrepancy, confirm: (1) which file the paper claims to use for that statistic, (2) whether the difference reflects a real error or a legitimate distinction between denominators. Do not flag 136 vs 140 as a discrepancy when the paper explicitly distinguishes a severity-ladder sample from the full corpus."
    enforced_by: prompt-only
