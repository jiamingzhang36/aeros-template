version: '0.1'
principle: External economics skills can accelerate work, but AEROS controls evidence
  status, file permissions, protected definitions, claim boundaries, critic review,
  and human gates.
sources:
  awesome_econ_ai_stuff:
    name: Awesome Econ AI Stuff
    url: https://github.com/meleantonio/awesome-econ-ai-stuff
    role: Stage-organized catalog of economics AI skills.
  econ_writing_skill:
    name: Econ Writing Skill
    url: https://github.com/hanlulong/econ-writing-skill
    role: Economics writing, rewriting, review, and paper audit skill.
  awesome_ai_for_economists:
    name: Awesome AI for Economists
    url: https://github.com/hanlulong/awesome-ai-for-economists
    role: Tool and infrastructure index for economists.
  local_codex_skills:
    name: Local Codex Skills
    url: local
    role: Already installed local skills for economics, data, writing, replication,
      and document workflows.
  academic_research_suite:
    name: Academic Research Suite
    url: local
    role: Codex-native academic research workflows for deep research, paper writing,
      review, pipeline, and experiment planning.
  lcrawfurd_academic_skills:
    name: Claude Code Skills for Academic Research
    url: https://lcrawfurd.github.io/claude-skills/
    role: Paper review, code review, computational reproducibility audit, and pre-submission
      review skills for academic economists and social scientists.
  academic_research_agent_skill:
    name: Academic Research Agent Skill
    url: https://ngtiendong.github.io/Academic-Research-Agent-Skill/
    role: Human-guided research workflow with source inspection, novelty gates, experiment
      planning, reviewer simulation, and claim verification.
  paper_writer_skill:
    name: Paper Writer Skill
    url: https://github.com/kgraph57/paper-writer-skill
    role: Full-pipeline academic paper writing with stage gates and quality checklists.
skill_stage_taxonomy:
  external_stages:
  - ideation
  - literature
  - theory
  - data
  - analysis
  - writing
  - communication
  - engineering
  aeros_stages:
  - discovery_ideation
  - literature_discovery
  - literature_extraction
  - data_scouting
  - design_formation
  - execution_analysis
  - writing_revision
  - communication
  - engineering_maintenance
skills:
  research_ideation:
    name: research-ideation
    source: awesome_econ_ai_stuff
    invocation: external_repo
    external_stage: ideation
    aeros_stage: discovery_ideation
    use_status: allowed_with_constraints
    allowed_outputs:
    - discovery/idea_bank.csv
    - discovery/idea_memo.md
    - discovery/01_literature_scope.md
    forbidden_outputs:
    - final go/no-go decision
    - formal gap claim
    - final causal design
    aeros_constraints:
    - All generated ideas must be marked speculative, under_verification, supported,
      parked, dropped, or promoted_to_design.
    - No idea can enter design_options.md without literature, data, or method evidence.
    human_gate_required: false
    tier: core
    default_use: true
  lit_review_assistant:
    name: lit-review-assistant
    source: awesome_econ_ai_stuff
    invocation: external_repo
    external_stage: literature
    aeros_stage: literature_discovery
    use_status: allowed_with_constraints
    allowed_outputs:
    - discovery/literature/search_log.csv
    - discovery/literature/paper_registry.csv
    - discovery/literature/exclusion_log.csv
    forbidden_outputs:
    - final literature synthesis without extraction cards
    - gap claim based on search snippets
    - paper summary based on title only
    aeros_constraints:
    - Search results must flow through paper_registry.csv.
    - Full synthesis requires extraction cards.
    - Abstract-only papers must be labeled abstract_only.
    human_gate_required: false
    tier: core
    default_use: true
  academic_research_suite_deep_research:
    name: academic-research-suite
    source: academic_research_suite
    invocation: mcp_skill
    external_stage: literature
    aeros_stage: literature_discovery
    use_status: allowed_with_constraints
    allowed_outputs:
    - discovery/01_literature_scope.md
    - discovery/literature/search_log.csv
    - discovery/literature/paper_registry.csv
    - discovery/literature/citation_audit.md
    - discovery/literature/extraction_cards/
    forbidden_outputs:
    - source synthesis without opened sources
    - novelty claim without closest-literature extraction
    - formal recommendation without human gate
    aeros_constraints:
    - Use source-grounded mode only.
    - Do not load or run a full research-to-paper pipeline before discovery promotion.
    - Claims from this skill must pass paper_registry, citation_audit, and extraction-card
      checks.
    human_gate_required: false
    tier: core
    default_use: true
  data_inventory:
    name: data-inventory
    source: local_codex_skills
    invocation: mcp_skill
    external_stage: data
    aeros_stage: data_scouting
    use_status: allowed_with_constraints
    allowed_outputs:
    - discovery/data_inventory.csv
    - docs/data_sources.md
    - audits/data_audit_report.md
    forbidden_outputs:
    - data feasibility claim without access path
    - undocumented paid or restricted-data assumption
    aeros_constraints:
    - Every data source must record owner, access path, unit, geography, time period,
      variables, barriers, and limitations.
    human_gate_required: false
    tier: core
    default_use: true
  causal_id_review:
    name: causal-id-review
    source: local_codex_skills
    invocation: mcp_skill
    external_stage: analysis
    aeros_stage: design_formation
    use_status: review_only
    allowed_outputs:
    - audits/design_audit_report.md
    - discovery/design_options.md
    - docs/method_card.md
    forbidden_outputs:
    - final identification decision
    - unapproved protected definition changes
    aeros_constraints:
    - Use to surface identification risks, not to decide the design.
    - Causal designs require documented variation and human approval.
    human_gate_required: true
    tier: core
    default_use: true
  did_checklist:
    name: did-checklist
    source: local_codex_skills
    invocation: mcp_skill
    external_stage: analysis
    aeros_stage: design_formation
    use_status: review_only
    allowed_outputs:
    - audits/design_audit_report.md
    - docs/robustness_checklist.md
    forbidden_outputs:
    - automatic approval of DiD design
    - preferred event window chosen by significance
    aeros_constraints:
    - Use for parallel trends, anticipation, treatment timing, comparison group, event-study,
      and clustering checks.
    human_gate_required: true
    tier: core
    default_use: true
  code_review_econ:
    name: code-review-econ
    source: local_codex_skills
    invocation: mcp_skill
    external_stage: engineering
    aeros_stage: engineering_maintenance
    use_status: review_only
    allowed_outputs:
    - audits/code_review_report.md
    - decisions/issue_log.csv
    forbidden_outputs:
    - silent code edits
    - review that ignores empirical-design consequences
    aeros_constraints:
    - Findings should prioritize reproducibility, data provenance, sample construction,
      estimands, and output consistency.
    human_gate_required: false
    tier: core
    default_use: true
  econ_writing_skill:
    name: econ-write
    source: econ_writing_skill
    invocation: external_repo
    external_stage: writing
    aeros_stage: writing_revision
    use_status: allowed_with_constraints
    allowed_outputs:
    - paper/draft.md
    - paper/draft.tex
    - audits/writing_audit_report.md
    - audits/referee_panel_report.md
    forbidden_outputs:
    - stronger causal claim than claim_registry.md
    - forecast language without forecast validation
    - policy conclusion beyond language_constraints.md
    aeros_constraints:
    - Writing must preserve registered claim type and evidence status.
    - Unsupported claims must be removed, weakened, or marked for human decision.
    - For introduction and conclusion drafts, check against claim_registry.md and
      language_constraints.md.
    human_gate_required: true
    tier: core
    default_use: true
