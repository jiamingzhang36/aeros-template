task_id: T007_replication_package
stage: execution
gate: G9
depends_on: [T006_referee_panel]
goal: >
  Check whether the project can be packaged for replication. Audit environment,
  data access rules, pipeline entry points, registered outputs, provenance, and
  unresolved release blockers.

inputs:
  - README_replication.md
  - Makefile
  - environment.yml
  - requirements.txt
  - code/
  - data/README_data.md
  - evidence/result_index.csv
  - outputs/.provenance/
  - paper/

allowed_outputs:
  - audits/replication_package_report.md
  - agent_runs/

forbidden_actions:
  - "Do not expose restricted data."
  - "Do not edit publication-facing files unless explicitly instructed."
  - "Do not change protected definitions or data-sharing rules."

checks:
  - check_replication_package.py
  - check_pipeline_runs.py
  - check_output_reproducibility.py
  - check_provenance.py
  - check_agent_run_report.py

retry_policy:
  max_retries: 1

escalate_if:
  - "replication release needs human approval"
  - "checks still fail after max_retries"

budget:
  max_agent_calls: 2
  max_dollars: 1.0
  timeout_seconds: 480
