task_id: T009_expanded_collection_design
stage: execution
gate: G11
automation_class: frozen_evidence
evidence_receipt_required: true
receipt_path: evidence/receipts/T009_expanded_collection_design_frozen_evidence_receipt.md
gate_status: needs_receipt_audit
required_skill_classes: []
allowed_skills:
- data-inventory
- data-quality-checker
- policy-timeline
recommended_skills:
- data-inventory
- data-quality-checker
- policy-timeline
depends_on:
- T008_paper_package_draft
goal: 'Design the expanded AI-output collection that can move the project beyond the
  current-Codex-session pilot. Specify personas, prompt variants, models, repetitions,
  metadata, exclusion rules, and collection risks without running collection yet.

  '
inputs:
- paper/draft.md
- docs/method_card.md
- execution/protocol/main_execution_protocol.md
- docs/robustness_checklist.md
- audits/paper_package_report.md
- evidence/claim_registry.md
allowed_outputs:
- execution/collection/expanded_collection_plan.md
- outputs/audit_runs/expanded_prompt_grid.csv
- audits/expanded_collection_design_report.md
- agent_runs/
forbidden_actions:
- Do not collect new AI outputs in this design task.
- Do not strengthen claims beyond the claim registry.
- Do not modify raw data or protected definitions.
checks:
- check_expanded_collection_design.py
- check_claim_registry.py
- check_agent_run_report.py
retry_policy:
  max_retries: 1
escalate_if:
- expanded grid changes the research question or claim ceiling
- model/provider access requires human approval
- checks still fail after max_retries
budget:
  max_agent_calls: 2
  max_dollars: 1.0
  timeout_seconds: 480
