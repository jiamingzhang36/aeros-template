estimand_data_contract:
  status: active
  claim_id: "PAPER1_MEASUREMENT"
  research_question: "Across U.S. states in the public SNAP food-restriction waiver approval-risk window, how heterogeneous are the approved/publicly-visible policy-rule designs, and what is the ex-ante exposure of pre-policy low-income-proxy purchase baskets to each state's policy-rule basket? (Measurement/descriptive; design option O1. Not causal, not welfare, not actual SNAP/EBT behavior.)"
  unit_of_observation: "U.S. state, with state-by-category policy-rule vectors Policy_s,c; state-quarter for covariates; state-year category aggregates for exposure."
  population: "U.S. states (plus DC) in the public SNAP food-restriction waiver approval-risk window, 2025-2026, on the frozen roster (2026-03-12 freeze; 2026-03-19 source check)."
  treatment_or_exposure: "State-by-category restriction indicator vector Policy_s,c (which standardized food/beverage categories each approved or publicly-visible waiver rule restricts); RuleExposure on a common pooled basket and ActualExposure_s = sum_c Policy_s,c * Share_s,c."
  outcome: "(1) public_approval_status: indicator that a state had a public USDA approval by the frozen roster date (non-approved public-risk states held right-censored). (2) policy_specific_exposure: share of pre-policy NielsenIQ low-income-proxy food/beverage spending inside each state's policy-rule basket."
  comparison: "Across-state comparison of policy-rule design and ex-ante exposure within the public approval-risk set; rule-scope comparison via the common pooled basket. No causal/counterfactual comparison (per O1/O2 claim boundaries)."
  time_window: "Policy and approval coding 2025-2026 (frozen roster 2026-03-12); pre-policy NielsenIQ exposure 2022-2024."
  required_variation: "Cross-state variation in policy-rule design (which categories restricted) and in ex-ante basket exposure; for descriptive approval-risk concentration (O2), presence of both approved and non-approved public-risk states."
  required_variables:
    - "policy_rule_vector (D003)"
    - "public_approval_status (D001)"
    - "policy_specific_exposure (D004)"
    - "state-quarter covariates / governor party benchmarks (D005)"
  join_keys:
    - "state (USPS/FIPS)"
    - "state x standardized food/beverage category"
    - "state-quarter (for covariates)"
  minimum_coverage: "All public approval-risk states for document-coded policy/approval variables; ex-ante exposure limited to approved states present in NielsenIQ aggregate outputs (US+DC, currently excluding AK and HI, reported as not-covered rather than imputed)."
  maximum_missingness: "Document-coded policy/approval variables: no imputation; states lacking document-grade evidence are held missing/right-censored. Exposure: states absent from NielsenIQ outputs are reported not-covered, not imputed. (Measurement design, not threshold-gated estimation.)"
  quality_thresholds: "Viability gates from D003 design options: inventory_rows >= 5 (measurement viable) and public_sources >= 3 (descriptive concentration viable); document-grade evidence required before any claim registration (provenance requirement)."
  probe_sampling_strategy: "Wrapper diagnostics over the MAHA source inventory: confirm D001-D004 present with public or granted aggregate access; verify the frozen roster against the canonical source manifest."
  probe_success_condition: "Inventory present with >= 5 rows and >= 3 public sources; D001-D004 located with documented access; frozen-roster verification recorded."
  probe_stop_condition: "Hold measurement if inventory < 5 rows or required D001-D004 sources are missing/unverifiable. Controlled household-cluster CI is deferred until the controlled DuckDB disk reconnects (a precision upgrade, not a measurement prerequisite)."
  source_access_class: "Mixed: D001/D002 public; D003 granted project-derived; D004 NielsenIQ restricted (controlled workflow, aggregate-only exports)."
  license_class: "Public documents (D001/D002); project-internal derived (D003); restricted NielsenIQ license with no household identifiers or purchase rows exported (D004)."
  credential_requirement: "None for D001-D003 (public/granted). D004 requires controlled NielsenIQ access via the MAHA controlled workflow; no raw microdata passes through the wrapper."
  estimated_cost: "$0 marginal: uses existing public documents and previously-produced NielsenIQ aggregate outputs; no new data purchase. Controlled household-cluster CI needs only compute on already-licensed data."
  fallback_source: "If NielsenIQ exposure outputs are unavailable, fall back to the public-document administrative chronology plus policy taxonomy (O2 descriptive floor), which needs no restricted exposure data."
