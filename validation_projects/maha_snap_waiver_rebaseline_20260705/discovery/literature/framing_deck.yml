        kind: empirical

  - id: F07
    function: background-institutional
    framework: "WIC food-package implementation and UPC/vendor lists as institutional analogy"
    rationale: "WIC shows how food-benefit eligibility rules become operational through approved product lists, vendor systems, and substitution margins, which is a close analogy for SNAP retailer implementation friction."
    role: motivation
    caveat: "WIC is a different program with narrower eligible populations and stronger pre-existing product-list infrastructure, so it should anchor implementation logic rather than identify SNAP waiver effects."
    decision: proposed
    anchors:
      - author: "National Academies of Sciences, Engineering, and Medicine"
        year: 2017
        title: "Review of WIC Food Packages: Improving Balance and Choice: Final Report"
