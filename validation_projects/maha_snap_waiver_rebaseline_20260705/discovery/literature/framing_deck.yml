        title: "Administrative burden in nutrition assistance program implementation"
        openalex_id: ""
        doi: ""
        verification_status: pending
        kind: empirical

  - id: F09
    function: method-identification
    framework: "Waiver federalism and federal-side selection"
    rationale: "SNAP food restriction waivers are a federal-state approval instrument, so the approval-risk module must allow federal priorities, state proposal quality, and political alignment to jointly shape observed approvals."
    role: identification-threat
    caveat: "Governor party may proxy a broader political-administrative alignment under a single federal regime; it is not an exogenous treatment unless federal-side selection and state-side application selection can be separated."
    decision: proposed
    anchors:
