        title: "The Persistence of Healthy Behaviors in Food Purchasing"
        openalex_id: ""
        doi: "10.1287/mksc.2022.1396"
        verification_status: verified
        kind: empirical

  - id: F08
    function: theory-mechanism
    framework: "Administrative burden and implementation friction"
    rationale: "Approval letters are not realized restrictions: retailer readiness, product-list ambiguity, reporting requirements, and modification letters create later administrative margins."
    role: mechanism-tested
    caveat: "The current evidence observes public documents and target implementation dates, not full retailer compliance costs or checkout-level realization; mechanism language must remain illustrative unless direct implementation data are added."
    decision: proposed
    anchors:
      - author: "Herd and Moynihan"
        year: 2018
