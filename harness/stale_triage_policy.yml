version: "0.1"
policy: AEROS-STALE-TRIAGE-001
principle: >
  Stale task handling must be deterministic, conservative, and cheap-first.
  AEROS may suppress stale noise only when it can prove the stale task is not
  connected to the current frontier and its allowed outputs did not change.
buckets:
  rerun_required:
    meaning: "A stale task may affect the current frontier or claim-bound outputs, or outputs changed so safety cannot be proven. Preview with iterate --dry-run before any real run."
    command_rule: "must contain --dry-run"
  revalidate_free:
    meaning: "A stale task has unchanged allowed-output fingerprints; refresh through recover --check before spending provider/API budget."
    command_rule: "must use aeros recover TASK --check"
  suppress_as_irrelevant:
    meaning: "A stale task is provably disconnected from the current frontier and outputs are unchanged; do not surface as the next action."
    command_rule: "must not execute anything"
impact_sources:
  - task_dependency_dag
  - task_fingerprints
  - allowed_outputs
  - evidence/result_index.csv
  - evidence/evidence_ledger.csv
  - evidence/claim_registry.md
  - evidence/research_graph.yml
hard_boundaries:
  - "No LLM or heuristic/vibe ranking."
  - "If irrelevance cannot be proven, keep the stale item visible."
  - "Claim-bound or result-bound stale paths must be high-impact review items."
  - "Triage must not mark tasks stale, approve gates, downgrade claims, or change runtime state."
