version: "0.1"
policy: AEROS-SESSION-SCOPE-001
principle: >
  Chat-driven work must declare one active lane and objective. The session guard
  audits changed files against lane scope so off-scope drift becomes visible
  instead of silently mixing data, literature, claims, writing, and harness work.
common_allowed_prefixes:
  - SESSION_CONTRACT.yml
  - CURRENT_STATE.md
  - NEXT_ACTION.md
  - CONTEXT_BUNDLE.md
  - agent_runs/
  - outputs/logs/
  - outputs/context/
  - evidence/delta_log.jsonl
  - aeros/state/global_state.yml
  - decisions/revision_log.md
  - decisions/update_ledger.md
  - decisions/update_ledger_chain.jsonl
  - harness/improvement_backlog.yml
lanes:
  data:
    allowed_prefixes:
      - data/
      - discovery/data_inventory.csv
      - discovery/feasibility_matrix.md
      - docs/data_contract.yml
      - docs/data_dictionary.md
      - docs/data_sources.md
      - code/00_setup/
      - code/01_ingest/
      - code/02_clean/
      - code/03_construct/
      - data/backfill/
    forbidden_prefixes:
      - paper/
      - discovery/literature/
      - evidence/claim_registry.md
  literature:
    allowed_prefixes:
      - discovery/literature/
      - docs/related_work
      - paper/references
    forbidden_prefixes:
      - data/raw/
      - data/clean/
      - evidence/claim_registry.md
      - paper/draft
  method:
    allowed_prefixes:
      - design/
      - docs/method
      - code/04_analysis/
      - code/05_robustness/
      - templates/estimand
      - evidence/estimand
    forbidden_prefixes:
      - data/raw/
      - paper/draft
      - evidence/claim_registry.md
  analysis:
    allowed_prefixes:
      - code/04_analysis/
      - code/05_robustness/
      - code/06_tables/
      - code/07_figures/
      - outputs/tables/
      - outputs/figures/
      - outputs/model_outputs/
      - evidence/result_index.csv
      - evidence/result_registry.csv
      - outputs/.provenance/
    forbidden_prefixes:
      - paper/draft
      - evidence/claim_registry.md
  claim:
    allowed_prefixes:
      - evidence/
      - audits/
      - decisions/gates/
      - docs/design/falsification
    forbidden_prefixes:
      - data/raw/
      - paper/draft
  writing:
    allowed_prefixes:
      - paper/
      - poster/
      - tex/
      - docs/
      - outputs/tables/
      - outputs/figures/
      - quality_reports/writing/
    forbidden_prefixes:
      - data/raw/
      - evidence/claim_registry.md
  compliance:
    allowed_prefixes:
      - replication/
      - compliance/
      - docs/data_availability
      - paper/supplement
      - outputs/logs/
    forbidden_prefixes:
      - data/raw/
      - evidence/claim_registry.md
  harness:
    allowed_prefixes:
      - aeros/
      - checks/
      - harness/
      - templates/
      - tools/
      - docs/design/
      - project_manifest.yml
      - AGENTS.md
    forbidden_prefixes:
      - data/raw/
      - paper/draft.md
      - evidence/claim_registry.md
workflow_presets:
  framework_rollout:
    description: "Sync or migrate AEROS framework files in a project without touching research evidence, claims, or paper content."
    allowed_prefixes:
      - AGENTS.md
      - aeros/
      - checks/
      - harness/
      - templates/
      - tools/
      - docs/architecture_v0_5.md
      - docs/design/
      - examples/
      - tests/
      - agent_runs/TEMPLATE_agent_run_report.md
      - agent_runs/TEMPLATE_critic_report.md
      - discovery/AGENTS.md
      - discovery/route_decision.yml
      - discovery/literature/AGENTS.md
      - discovery/literature/TEMPLATE_extraction_card.md
      - discovery/literature/literature_rules.md
      - discovery/literature/function_taxonomy.md
      - decisions/update_ledger_chain.jsonl
      - decisions/human_gate_queue.yml
      - project_manifest.yml
    allowed_actions:
      - framework sync
      - sync doctor
      - harness smoke
      - route scaffold migration
      - ledger-chain local anchor
    forbidden_prefixes:
      - data/raw/
      - data/intermediate/
      - data/processed/
      - evidence/claim_registry.md
      - paper/
      - poster/
      - tex/
      - decisions/approvals/
  broad_capture_leads:
    description: "Wide early lead capture into isolated queues; not evidence, not canonical, not claim-supporting."
    allowed_prefixes:
      - work/leads/
      - data/backfill/
      - audits/broad_capture/
      - quality_reports/broad_capture/
      - outputs/logs/
      - evidence/delta_log.jsonl
    allowed_actions:
      - broad search
      - lead sweep
      - source group probe
      - candidate queue update
    forbidden_prefixes:
      - data/raw/
      - data/intermediate/
      - data/processed/
      - paper/
      - evidence/claim_registry.md
      - decisions/approvals/
  recapture_source_pool:
    description: "Recover and review candidate source pools without promoting them to canonical evidence."
    allowed_prefixes:
      - work/recapture_
      - audits/source_recapture/
      - quality_reports/source_recapture/
      - source_snapshots/
      - evidence/delta_log.jsonl
    allowed_actions:
      - source recapture
      - chrome-assisted review
      - source-promotion queue
    forbidden_prefixes:
      - evidence/claim_registry.md
      - decisions/approvals/
  claim_audit:
    description: "Audit claim support and deltas without collecting new raw data."
    allowed_prefixes:
      - audits/claim/
      - audits/advisory/
      - evidence/research_graph.yml
      - evidence/delta_log.jsonl
      - quality_reports/claim_audit/
    allowed_actions:
      - claim audit
      - support-chain review
      - delta audit
    forbidden_prefixes:
      - data/raw/
      - decisions/approvals/
  writing_guardrail:
    description: "Bounded paper/TeX edits and guardrail reports tied to existing claims and numbers."
    allowed_prefixes:
      - paper/
      - poster/
      - tex/
      - output/tex/
      - outputs/tex/
      - quality_reports/writing/
      - audits/writing/
      - evidence/delta_log.jsonl
    allowed_actions:
      - bounded writing edit
      - number/claim guardrail
      - tex compile review
    forbidden_prefixes:
      - data/raw/
      - evidence/claim_registry.md
      - decisions/approvals/
  chrome_assisted_review:
    description: "Browser-assisted source review that produces staging notes, screenshots, or queues."
    allowed_prefixes:
      - work/chrome_review/
      - work/recapture_
      - audits/chrome_assisted_review/
      - quality_reports/chrome_assisted_review/
      - source_snapshots/
      - evidence/delta_log.jsonl
    allowed_actions:
      - chrome-assisted review
      - source locator check
      - manual page audit
    forbidden_prefixes:
      - evidence/claim_registry.md
      - decisions/approvals/
  source_promotion_queue:
    description: "Promote reviewed staging sources into explicit queues without claiming final evidence."
    allowed_prefixes:
      - work/source_promotion/
      - audits/source_promotion/
      - quality_reports/source_promotion/
      - data/backfill/
      - discovery/data_inventory.csv
      - docs/data_sources.md
      - evidence/delta_log.jsonl
      - aeros/state/global_state.yml
    allowed_actions:
      - source promotion queue
      - backfill queue update
      - global state refresh
    forbidden_prefixes:
      - paper/
      - evidence/claim_registry.md
      - decisions/approvals/
  submission_release_preflight: {description: Check submission/release readiness without declaring paper-ready or public-release approval., allowed_prefixes: [paper/, replication/, compliance/, audits/submission_preflight/, quality_reports/submission_preflight/, outputs/logs/, evidence/delta_log.jsonl], allowed_actions: [submission preflight, release checklist, replication package audit], forbidden_prefixes: [data/raw/, evidence/claim_registry.md, decisions/approvals/]}
non_goals:
  - "Does not revert off-scope files automatically."
  - "Does not approve cross-lane work; it only surfaces drift."
  - "Does not certify research substance or gate completion."
semantic_verdicts:
  expected_lane_change: "Changed files match the declared lane."
  supporting_cross_lane_change: "Allowed support file changed outside the lane; review but not automatically drift."
  bookkeeping_only: "Only context/log/ledger surfaces changed."
  SCOPE_DRIFT: "Changed files fall outside the declared lane scope."
  CLAIM_SCOPE_DRIFT: "A non-writing/non-claim session touched paper claim-language surfaces."
  AUTHORITY_DRIFT: "A session touched claim, gate, release, or runtime authority surfaces outside its authority."
