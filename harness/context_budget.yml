version: "0.1"
policy: AEROS-CONTEXT-BUDGET-001
principle: >
  Context is an engineered input, not a transcript dump. AEROS should give
  agents the smallest project-specific context bundle that contains the next
  action, stop rule, blocker, lane state, and source anchors needed for the
  current step.
brief_max_lines: 40
lane_max_lines: 80
max_recent_deltas: 5
max_human_gate_items: 3
max_source_hashes: 12
must_include:
  - current_goal
  - recommended_next_action
  - status_label
  - next_command
  - stop_rule
  - does_not_prove
context_risks:
  - context_poisoning
  - context_distraction
  - context_confusion
  - context_clash
  - stale_retrieval
boundaries:
  - Context bundles do not certify substantive progress.
  - Context bundles do not approve gates or claims.
  - Agents should read referenced files only when the next action requires them.
  - Long-term memory must be project-scoped and source-anchored, not free-floating chat memory.

stale_context_policy:
  compare_against: outputs/context/context_bundle.json
  stale_if:
    - tracked_source_hash_changed
    - tracked_source_removed
    - bundle_lane_differs_from_requested_lane
  action: "Regenerate with `aeros cockpit --write` or `aeros context --write` before relying on old context."

context_episode_policy:
  principle: >
    AEROS-managed advice must record a fresh scoped context basis before it is
    shown. Closing an episode records declared work separately from bounded
    observed workspace and artifact changes.
  store: outputs/context/episodes/
  managed_advice_entrypoints:
    - aeros next
    - aeros drive
    - aeros driver submission
    - aeros submit
    - aeros task preflight
    - aeros cockpit
  raw_chat_transcripts: forbidden
  raw_tool_output: forbidden
  require_close_summary_for_manual_close: true
  artifact_hash_limit_bytes: 16777216
  workspace_delta: git_status_only
  boundaries:
    - A context episode is not a completion receipt.
    - A declared summary is not independent verification.
    - Shared-worktree deltas are not exclusive agent attribution.
    - If episode storage is unavailable, advice may use an explicit EPHEMERAL_UNPERSISTED context basis; it must not claim durable context history.
