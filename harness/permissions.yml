# Permission policy for empirical research harness runs.
#
# This file is intentionally tool-agnostic. If a local agent system supports
# permissions or hooks, translate these policies into that system's allow / ask /
# deny rules. If it does not, treat this as the review checklist for each run.

version: "0.1"

# Human adjudication trust anchor.
#
# local_authorship is provenance, not proof of a human. Security-sensitive
# decisions require a signature bound here to an approver. Runtime verification
# reads this policy from committed HEAD and ignores repository allowed-signers
# configuration, so an agent cannot enroll its own key by editing git config.
human_approval:
  enforcement: "git_committer"   # compatibility field; campaign/gate hard floors cannot be disabled here
  approver_identity:
    - "gagaggg36"                # human-held git author(s) allowed to grant approvals
  agent_identity:
    - "aeros-agent"              # the autonomous loop commits under this; never counts as approval
  approval_artifact_dir: "decisions/approvals"
  minimum_authority:
    campaign_release: "signed_commit"
    gate_approval: "signed_commit"
    gate_apply: "signed_commit"
    claim_upgrade: "signed_commit"
    release: "signed_commit"
  # Bootstrap the first signer interactively with `aeros authority bootstrap`.
  # Later changes to this policy must be signed by a signer in the preceding policy.
  # SSH row: {identity: "name above", principal: "email", ssh_public_key: "ssh-ed25519 AAAA..."}
  # GPG row: {identity: "name above", gpg_fingerprint: "FULL40CHARFINGERPRINT"}
  trusted_signers: []

defaults:
  work_mode: "branch_or_isolated_worktree"
  push_to_remote: "human_only"
  delete_files: "ask"
  overwrite_outputs: "ask_unless_task_allows"
  raw_data_write: "deny"
  protected_definition_write: "ask"
  claim_strengthening: "ask"

deny:
  paths:
    - "data/raw/**"
  commands:
    - "rm -rf"
    - "git reset --hard"
    - "git clean -fd"
    - "git push --force"

ask:
  paths:
    - "docs/protected_definitions.yml"
    - "docs/method_card.md"
    - "docs/data_contract.yml"
    - "evidence/claim_registry.md"
    - "decisions/decision_log.csv"
  actions:
    - "change preferred specification"
    - "change sample restriction"
    - "change outcome definition"
    - "change key exposure definition"
    - "replace main result"
    - "strengthen claim type"

allow_by_default:
  paths:
    - "code/**"
    - "outputs/logs/**"
    - "agent_runs/**"
    - "audits/**"
  actions:
    - "read project files"
    - "write run reports"
    - "write audit reports"
    - "run checks"

required_after_changes:
  code:
    - "checks/check_no_raw_data_changes.py"
    - "checks/check_protected_definitions.py"
  claims:
    - "checks/check_claim_registry.py"
  paper_or_outputs:
    - "checks/check_number_registry.py"
    - "checks/check_number_scan.py"
  task_or_run_reports:
    - "checks/check_task_contract.py"
    - "checks/check_agent_run_report.py"
