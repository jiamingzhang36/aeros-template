version: "0.1"
policy: AEROS-STATUS-LABELS-001
principle: >
  AEROS final updates must distinguish mechanical checks, route readiness, and
  substantive research progress. A PASS is not automatically a research result.
labels:
  CHECK_PASS:
    meaning: Mechanical checks, schemas, receipts, or harness validations passed.
    may_claim:
      - "A check or guardrail passed."
      - "The route did not break framework invariants."
    must_not_claim:
      - "Data was acquired."
      - "Literature was fully reviewed."
      - "A result or claim is substantively supported."
  CAPTURE_LOGGED:
    meaning: Early lead/candidate capture was logged inside non-promotable surfaces.
    may_claim:
      - "Leads or candidates were captured into isolated queues."
      - "The capture did not touch canonical data, claims, paper, or release surfaces."
    must_not_claim:
      - "A route is ready."
      - "Evidence was admitted."
      - "Data, claims, or paper content are supported."
  ROUTE_READY:
    meaning: A plan, queue, approval packet, route audit, or execution packet is ready.
    may_claim:
      - "The next route is specified."
      - "The human can approve, block, or modify the route."
    must_not_claim:
      - "The routed work has already produced evidence."
      - "Blocked work is complete."
  SUBSTANTIVE_PRODUCED:
    meaning: A real source snapshot, data artifact, full-text extraction, result, paper edit, or approved decision changed the research substance.
    may_claim:
      - "The specified substantive artifact exists."
      - "The artifact changed what the project knows or can say."
    must_not_claim:
      - "Scientific validity beyond the registered evidence."
      - "Human gate approval unless an approval artifact exists."
  DECISION_RECORDED:
    meaning: A human decision or approval artifact was recorded as governance authority, but it is not research-substantive output by itself.
    may_claim:
      - "A decision was recorded."
      - "The decision can authorize a bounded next step if fresh."
    must_not_claim:
      - "Data, literature, results, or paper content changed."
      - "Scientific validity or claim support was proven."
final_response_rule:
  required: true
  instruction: >
    When reporting task outcomes, end with one of CHECK_PASS, CAPTURE_LOGGED, ROUTE_READY,
    SUBSTANTIVE_PRODUCED, or DECISION_RECORDED. Use the weakest honest label.
    SUBSTANTIVE_DONE is a deprecated compatibility alias only.
