version: 2
policy: AEROS-EVENT-SOURCING-002
principle: The event log is append-only, hash-chained, and replay-tested; materialized views are projections, not authorities.
authoritative_log: events/event_log.jsonl
required_event_fields:
  - event_id
  - parent_event_hash
  - artifact_hash
  - timestamp
  - actor
  - action_type
  - input_hashes
  - output_hashes
  - schema_version
requirements:
  - id: append_only_hash_chain
    rule: every event_id is the hash of canonical event payload and every parent_event_hash points to the previous event_id
  - id: content_addressed_artifacts
    rule: event inputs and outputs must record path, sha256, bytes, and existence at event time
  - id: deterministic_replay
    rule: replaying the same event log must produce the same digest and derived facts
  - id: replay_matches_materialized_views
    rule: replay-derived facts must not contradict declared global_state or other derived views
  - id: preanalysis_happens_before_outcome_access
    rule: preanalysis_plan_committed must happen before access_outcome, run_spec, or register_result events for confirmatory claims
  - id: materialized_views_are_derived
    rule: global_state, analysis ledgers, research graph, and claim registry should migrate toward event-derived projections
