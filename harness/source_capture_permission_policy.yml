version: "0.1"
policy: AEROS-SOURCE-CAPTURE-PERMISSION-001
principle: >
  Low-risk public staging capture should not require repeated human approval.
  Approval belongs at route/session boundaries, credential/cost/legal/privacy
  boundaries, or canonical promotion boundaries.
tiers:
  green_public_staging:
    approval_required: none_for_staging_public_capture
    allowed_when:
      - public URL, official site, OpenAlex/Zotero local metadata, or local PDF
      - no login, cookie, API key, paid access, private data, IRB, ToS, or robots concern is indicated
      - output_intent is only probe_only, staging_artifact, or audit_note
      - writes are limited to work, source_snapshots, audits, quality_reports, outputs/context, or evidence/delta_log.jsonl
    must_not_do:
      - write data/raw or canonical data
      - modify protected definitions, claim registry, paper, release, or approval artifacts
      - claim substantive data completion or evidence admission
  yellow_route_level:
    approval_required: route_level
    allowed_when:
      - browser/Chrome assisted review, portal crawl, CAPTCHA/Cloudflare-prone source, or bounded batch capture
      - source route needs human confirmation
      - output may become canonical_candidate but is not promoted yet
    approval_shape: "Approve a bounded route/session, e.g. domains, pages, time/cost cap, and stop conditions."
  red_human_required:
    approval_required: human_required
    triggers:
      - credentials, API key, paid/commercial source, account login, cookies
      - ToS, robots, redistribution, privacy, IRB, PII, or sensitive data uncertainty
      - data/raw, canonical_update, protected definitions, claim registry, paper release, replication release
      - public release or legal/compliance judgment
non_goals:
  - "Does not fetch sources."
  - "Does not admit evidence."
  - "Does not approve gates, claims, papers, data release, or canonical promotion."
  - "Does not waive source terms, license, privacy, or IRB duties."
