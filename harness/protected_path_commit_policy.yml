version: "0.2"
policy: AEROS-PROTECTED-PATH-COMMIT-001
principle: >
  Protected research-authority paths must not be committed by default from an
  agent run. The pre-commit hook is a local enforcement layer for the highest
  risk paths; it does not approve scientific changes or replace human gates.
protected_paths:
  exact:
    - docs/protected_definitions.yml
    - docs/data_contract.yml
    - evidence/claim_registry.md
    - decisions/decision_log.csv
    - harness/permissions.yml
  prefixes:
    - data/raw/
    - decisions/approvals/
    - campaigns/campaign_decisions.yml
override:
  env_var: AEROS_ALLOW_PROTECTED_COMMIT
  allowed_value: "1"
  rule: >
    Use only after an explicit human approval, gate decision, or protected-path
    review. The hook cannot verify scientific validity; it only prevents silent
    protected-path commits.
context_evidence:
  policy: AEROS-CONTEXT-EFFECT-COMMIT-001
  principle: >
    Significant research-facing changes require a staged AEROS effect report
    whose observed workspace delta includes the changed path. This establishes
    that a scoped preflight and close record exist; it does not prove the edit
    was scientifically correct or caused by AEROS guidance.
  exact: [evidence/claim_registry.md]
  prefixes: [paper/, tex/, data/processed/, evidence/, code/]
  accepted_effect_statuses:
    - BLOCKED_BEFORE_EXECUTION
    - REUSE_OR_REVALIDATION_PROMPTED
    - RISK_RAISED
    - GUIDANCE_RECORDED
    - RESPONSE_ARTIFACT_OBSERVED
  report_prefix: outputs/context/episodes/
  report_suffix: /effect_report.json
installation:
  template: tools/hooks/pre-commit-aeros-protected-paths
  installer: tools/install_aeros_git_hooks.zsh
  auto_installed: false
does_not_prove:
  - scientific validity
  - claim support
  - human approval
  - release readiness
  - absence of off-repo side effects
