version: "0.1"
policy: AEROS-CONTEXT-COMPILER-001
principle: >
  Context is not storage. Context is active attention allocation. Raw outputs
  must not enter the main agent context until compressed into claims, evidence,
  uncertainty, blockers, or next actions.
max_lines: 120
max_recent_deltas: 5
max_human_gate_items: 3
max_source_anchors: 12
max_files_to_read: 12
required_sections:
  - goal_context
  - state_context
  - evidence_context
  - decision_context
  - noise_context
  - next_action
  - attention_contract
  - communication_budget
main_context_admits:
  - current goal and stop condition
  - verified state summary
  - source-anchored evidence pointers
  - human decisions and blockers
  - deterministic next action
ledger_only:
  - raw check output
  - full command transcripts
  - bulk search results
  - intermediate failures after compression
requires_reverification:
  - stale source hashes
  - network-derived facts
  - official status pages
  - claim-affecting artifacts
communication_budget:
  default_mode: dense
  principle: "Compress communication, not evidence."
  target: output_only
  applies_to:
    - status updates
    - final summaries
    - context briefs
    - review comments
  preserve_exact:
    - code
    - commands
    - errors
    - paths/URLs/DOIs
    - claim/evidence/result IDs
    - hashes
    - direct quotes
  do_not_compress:
    - source evidence
    - methodological caveats
    - human gate decisions
    - legal or compliance boundaries
    - uncertainty statements
  risk_note: >
    Output brevity can reduce reading cost, but input/context compression can be
    net-negative and can distort meaning. AEROS therefore keeps source files and
    evidence artifacts intact and compresses only derived communication surfaces.
boundaries:
  - Context briefs do not certify substantive progress.
  - Context briefs do not approve gates or claims.
  - Context briefs do not replace source files, receipts, registries, or evidence graphs.
  - Agents should read referenced files only when the next action requires them.
