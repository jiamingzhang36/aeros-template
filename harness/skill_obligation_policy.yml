version: "0.1"
policy: AEROS-SKILL-OBLIGATION-001
principle: >
  Relevant skills are dynamically recommended, not a default completion
  ceremony. Ordinary tasks may use zero skills without a waiver. Use-or-waive
  is enforced only for classes explicitly listed in required_skill_classes.
  Skill use does not approve gates, certify claims, or weaken AEROS checks.
default_requirement: optional_record_if_used
max_dynamic_skills: 3
use_or_waive_trigger: explicit_required_skill_classes
profile_required_skill_classes:
  submit: [submission_review]
  regulated: []
classes:
  data_source:
    skills: [data-inventory, data-quality-checker, data-merge-audit]
    triggers: [data, source, probe, capture, inventory, denominator, gdp, schema]
  literature:
    skills: [academic-research-suite, lit-review-assistant, sci-download]
    triggers: [literature, citation, paper_registry, full-text, fulltext, pdf, doi, unpaywall, zotero, synthesis]
  writing:
    skills: [econ-write, pre-submission-audit]
    triggers: [paper, draft, writing, submission, referee, response]
  causal_identification:
    skills: [causal-id-review, did-checklist]
    triggers: [identification, causal, did, event study, method_card, design]
  replication:
    skills: [code-review-econ, replication-check]
    triggers: [replication, reproduc, provenance, pipeline, result_validation, code_review]
  submission_review:
    skills: [bib-manager, academic-research-suite, pre-submission-audit]
    triggers: [submission, submit, manuscript, paper, citation, package]
allowed_waiver_classes:
  - ledger_hash_only
  - typo_only
  - mechanical_revalidation
  - single_line_parser_patch
required_waiver_fields: [skill_class, reason, scope, progress_label]
tiers:
  core:
    default_use: true
    meaning: "high-priority dynamic candidate; not a completion obligation unless explicitly required"
  optional:
    default_use: false
    meaning: "task-specific skills used when clearly relevant"
  reference:
    default_use: false
    meaning: "inspiration or review framing only unless the human explicitly asks"
legacy_tier_aliases:
  advisory: optional
does_not_prove:
  - skill invocation
  - skill output correctness
  - scientific validity
  - claim support
  - human gate approval
