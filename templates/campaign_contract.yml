# AEROS Campaign Contract template
# Use this only when starting a repeated same-lane autonomous loop.
# It asks whether continuing the campaign is still worth it; it does not approve gates or claims.
version: 1
campaign_id: example_campaign
work_lane: data
objective_metric: clean_restriction_events
objective_markers:
  - clean restriction events
  - source verification
# Phrasing-independent scope guards: once the breaker trips, same-lane work is
# caught even if the intent is reworded to dodge the markers above.
#   objective_outputs: output path prefixes this campaign writes into.
#   objective_task_types: task modes/types that belong to this campaign.
objective_outputs:
  - data/backfill/
  - data/leads/
objective_task_types:
  - broad_capture
  - source_capture
current_value: 0
stop_condition: "define the decision-relevant win condition"
stop_condition_met: false
task_budget: 8
expected_yield_per_task: 3
marginal_yield_window: 3
research_value_window: 3
binding_constraint: numerator_size
fallback_if_stalled: "batch-ingest structured sources or escalate to human"
# Convergence / FREEZE: when the objective metric holds within
# convergence_epsilon across the last convergence_window tasks (and enough tasks
# have run), the breaker recommends stopping expansion and asking the human to
# finalize. Leave defaults (window = marginal_yield_window, epsilon = 0) or tune.
convergence_window: 3
convergence_epsilon: 0
# Human release valve (recorded via `aeros campaign continue|stop`, consumed by
# assess): a `continue` decision releases a named breaker for a bounded number
# of tasks, then it re-applies; a `stop` decision halts the campaign.
batch_source_available: false
rerun_decision_metric_after_gain: 10
# Campaign tasks should declare campaign_progress.metric_unique_key_columns.
# CSV/TSV evidence otherwise defaults conservatively to its first column.
# Progress is computed from novel unique units across prior campaign evidence;
# duplicate or previously counted records cannot inflate marginal yield.
# Optional per-task campaign_progress.research_value_events are restricted to:
# resolved_data_gap, probe_passed, route_decision_changed,
# claim_bearing_citation_grounded, diagnostic_obligation_closed,
# paper_exhibit_reproduced, replication_blocker_resolved.
does_not_prove:
  - scientific validity
  - claim support
  - gate approval
