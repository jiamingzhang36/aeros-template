project:
  name: AEROS project
  version: '1.0'
  template: aeros-template
  status: draft
  private_by_default: true
research:
  field_or_domain: ''
  topic: ''
  one_sentence_question: ''
  current_stage: discovery
  human_owner: ''
  collaborators: []
gate_lifecycle:
  current_gate: G0 Project Intake
  gates:
  - G0 Project Intake
  - G1 Data Readiness
  - G2 Measurement / Variable Construction
  - G3 Research Design
  - G4 Main Estimation
  - G5 Robustness
  - G6 Result Validation
  - G7 Claim Audit
  - G8 Referee Simulation
  - G9 Replication Package
  - G10 Paper Package Draft
  - G11 Expanded Collection
  - G12 Claim Upgrade Review
  - G13 Compliance / Release Gate
  # Gate tiering (Bainbridge: automate the mechanical, reserve human judgment).
  # Only these gates halt the autonomous loop for human ratification; every other
  # gate auto-advances when its check-based exit criteria pass. These four are the
  # judgments a check cannot adjudicate: identification design, claim typing,
  # claim upgrades, and public release. Omit this key to require human ratification
  # at every gate (conservative legacy behavior).
  human_gates:
  - G3
  - G7
  - G12
  - G13
  # Profiles (start simple): pick the smallest path that fits the project.
  # `lite` is a descriptive minimal ring; `full` is the complete G0-G13 ladder.
  # A profile only selects which gates' tasks run; the pipeline still pulls in
  # any task an active task depends on, so a slimmed profile cannot break the
  # task DAG. Switch with `profile: lite` (or override per run).
  profile: full
  profiles:
    full:
      active_gates: all
      human_gates: [G3, G7, G12, G13]
    lite:
      # Descriptive minimal ring: intake -> data -> design -> estimate ->
      # validate -> claim audit -> paper. Skips standalone measurement (G2),
      # robustness (G5), referee sim (G8), replication package (G9), and the
      # expansion/compliance tail (G11-G13) unless a dependency requires them.
      active_gates: [G0, G1, G3, G4, G6, G7, G10]
      human_gates: [G3, G7]
automation:
  agent_provider: manual
  # Independent critic: a verification pass separate from the worker, run after
  # a task passes its deterministic checks. It screens for empirical-research
  # failure modes (data leakage, metric misuse, significance-driven spec
  # selection, overclaiming) and surfaces concerns into the gate decision packet.
  # Advisory by default (does not block); set blocking: true to escalate on a
  # high-severity finding. Use a DIFFERENT model from the worker if you can
  # (LLMs verify better than they generate, but cannot self-verify reliably).
  # The non-LLM backstop remains check_output_reproducibility.
  critic:
    enabled: false          # opt-in; set true once a real provider is configured
    provider: claude-cli    # mock | openai | claude-cli | codex-cli
    model: claude
    blocking: false
    timeout_seconds: 180
  provider_connector:
    provider: mock
    model: mock-research-model
    max_cost_usd: 0.0
    max_retries: 1
    timeout_seconds: 120
    rate_limit_seconds: 0.0
  pipeline:
    cwd: .
    command:
    - python3
    - code/99_make_all.py
    - --mode
    - smoke
    key_outputs: []
    notes: Template placeholder. Replace with the instantiated project pipeline command.
gate_exit_criteria:
  G1:
    requires:
    - type: check_passes
      check: check_data_diagnostics.py
  G2:
    requires:
    - type: check_passes
      check: check_variable_construction.py
  G3:
    requires:
    - type: check_passes
      check: check_anchor.py
    - type: check_passes
      check: check_design_options.py
    - type: check_passes
      check: check_design_selection.py
    - type: check_passes
      check: check_no_degenerate_content.py
    - type: check_passes
      check: check_artifact_linkage.py
    - type: markdown_status_equals
      path: docs/method_card.md
      value: filled
  G4:
    requires:
    - type: check_passes
      check: check_execution_protocol.py
    - type: claim_main_results_registered
      path: evidence/claim_registry.md
    - type: claim_main_results_have_provenance
      path: evidence/claim_registry.md
  G5:
    requires:
    - type: file_exists
      path: docs/robustness_checklist.md
    - type: status_not_empty
      path: docs/robustness_checklist.md
  G6:
    requires:
    - type: claim_main_results_have_provenance
      path: evidence/claim_registry.md
    - type: result_index_all_have_provenance
      path: evidence/result_index.csv
  G7:
    requires:
    - type: claim_no_draft
      path: evidence/claim_registry.md
    - type: claim_main_has_type
      path: evidence/claim_registry.md
  G8:
    requires:
    - type: csv_nonempty_rows
      path: evidence/evidence_ledger.csv
      min_rows: 1
    - type: markdown_nonplaceholder_lines
      path: paper/draft.md
      min_lines: 1
  G9:
    requires:
    - type: file_not_placeholder
      path: code/99_make_all.py
      marker: Project master script placeholder
    - type: result_index_all_have_provenance
      path: evidence/result_index.csv
    - type: check_passes
      check: check_artifact_manifest.py
  G10:
    requires:
    - type: check_passes
      check: check_paper_package.py
    - type: check_passes
      check: check_number_registry.py
  G11:
    requires:
    - type: check_passes
      check: check_expanded_collection_design.py
    - type: check_passes
      check: check_expanded_collection_outputs.py
    - type: check_passes
      check: check_provider_collection.py
    - type: check_passes
      check: check_expanded_result_validation.py
  G12:
    requires:
    - type: check_passes
      check: check_claim_upgrade_review.py
    - type: claim_no_draft
      path: evidence/claim_registry.md
  G13:
    requires:
    - type: check_passes
      check: check_compliance_gate.py
