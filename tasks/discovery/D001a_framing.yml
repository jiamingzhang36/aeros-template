task_id: D001a_framing
stage: discovery
gate: G0
goal: >
  REASONING step, not a search. Given the research idea, reason about which
  literature FRAMEWORKS this idea draws on, organized by function bucket, and
  write them to discovery/literature/framing_deck.yml as a deck of cards.

  A research idea rests on three kinds of literature that share NO topic
  keywords with each other: substantive/topic (gap-verification,
  background-institutional, data-measurement), method/identification frameworks
  (e.g. policy diffusion, event study, difference-in-differences), and
  theory/mechanism frameworks (e.g. regulatory capture, entry deterrence). A
  topic keyword search only reaches the first kind. Your job here is the
  intellectual bridge the keyword search cannot do: name the method and theory
  frameworks this idea needs, and why.

  Produce framing_deck.yml with this schema:

    idea: "<one-line restatement of the research question>"
    cards:
      - id: F01
        function: theory-mechanism      # one of: idea-inspiring | gap-verification |
                                         #   method-identification | data-measurement |
                                         #   background-institutional | theory-mechanism
        framework: "Regulatory capture / political economy of regulation"
        rationale: "Why this framework applies to THIS idea (>= 1 full sentence)."
        role: mechanism-tested           # HOW the paper uses it, one of:
                                         #   motivation | mechanism-tested |
                                         #   identification-threat | measurement-strategy |
                                         #   robustness-comparison
        caveat: "The threat or limit this framework raises for THIS design (>= 1 sentence)."
        decision: proposed               # always 'proposed'; the human sets keep/drop
        anchors:
          - author: "Stigler"
            year: 1971
            title: "The Theory of Economic Regulation"
            openalex_id: "Wxxxxxxxxx"    # REQUIRED: verify via OpenAlex, record the id or a doi
            kind: theory                 # empirical | review | theory | method | data

  Rules for the deck:
  - You MUST propose at least one card for each of: gap-verification,
    method-identification, theory-mechanism (the buckets a keyword search leaves
    empty and the whole point of this step). Cover other buckets when relevant.
  - Every card needs a `role` (how the paper USES the framework, not just that it
    is related) and a `caveat` (the threat/limit it raises). A framework can be a
    threat to identification (e.g. policy diffusion -> endogenous treatment timing,
    Manski reflection problem), not only a method to borrow.
  - gap-verification MUST name >= 1 EMPIRICAL closest rival (anchor kind=empirical):
    the paper(s) most likely to make THIS study redundant. A review or perspective is
    NOT a closest rival; do not use one to fill the gap bucket. Do NOT pad the gap
    bucket with analogies to hit a count -- if the genuine closest-rival set is one
    paper, name one. Analogies from adjacent regulated industries belong in
    background-institutional, not gap-verification.

inputs:
  - discovery/idea_memo.md
  - discovery/01_literature_scope.md
  - project_manifest.yml

allowed_outputs:
  - discovery/literature/framing_deck.yml

forbidden_actions:
  - "Do not write anywhere under data/raw/ (enforced by a hook)."
  - "Do not enumerate a full paper list or write paper_registry.csv; this step names frameworks + seminal anchors only."
  - "Do not fabricate anchors. Verify every anchor against the OpenAlex API (https://api.openalex.org/works?search=...) and record its real openalex_id or doi. If you cannot verify an anchor, drop it rather than guess."
  - "Do not set any card's decision to keep or drop; leave it 'proposed' for the human gate."

checks:
  - check_framing_deck.py

retry_policy:
  max_retries: 2

escalate_if:
  - "any required bucket (gap-verification, method-identification, theory-mechanism) has no card"
  - "checks still fail after max_retries"

budget:
  max_agent_calls: 3
  max_dollars: 2.0
