task_id: D001_literature_search
stage: discovery
gate: G0
goal: >
  Find real academic literature relevant to the project idea and register each
  paper as one row in discovery/literature/paper_registry.csv. This is a
  DISCOVERY task only: locate and register sources. Do not read full text,
  summarize findings, classify a gap, or write any synthesis.

inputs:
  - discovery/01_literature_scope.md
  - project_manifest.yml

allowed_outputs:
  - discovery/literature/paper_registry.csv
  - discovery/literature/search_log.csv
  - discovery/literature/citation_audit.md

forbidden_actions:
  - "Do not write anywhere under data/raw/ (enforced by a hook; it will be blocked)."
  - "Do not summarize paper findings or write synthesis."
  - "Do not set status beyond 'discovered' or 'title_abstract_screened'."
  - "Do not set extraction_card=yes, used_in_synthesis=yes, or full_text_available=yes."
  - "Do not invent citations. Every registered row must carry a real, resolvable DOI or URL."
  - "Do not edit discovery/literature/synthesis/function_matrix.csv (function classification is a later task)."

# Every paper whose screening_decision is 'maybe' or 'include', or whose status is
# full_text_obtained or beyond, MUST also get a row in citation_audit.md keyed by its
# paper_id (Pxxx). Keep the existing table header and Risk Labels / Rules sections.
citation_audit:
  path: discovery/literature/citation_audit.md
  table_columns:
    - Paper ID            # Pxxx, must match the registry
    - Citation exists     # yes | unknown
    - DOI status          # resolves | no-doi | unknown
    - Stable source locator  # yes | no
    - Full text obtained  # no (at discovery)
    - Extraction card exists # no (at discovery)
    - Used in synthesis   # no (at discovery)
    - Risk                # discovered-only | abstract-only | citation-unverified | low
    - Notes

# The agent MUST produce paper_registry.csv with EXACTLY these columns, in order.
# This list is the single source of truth shared with check_literature_registry.py.
output_contract:
  registry_path: discovery/literature/paper_registry.csv
  registry_columns:
    - paper_id            # P001, P002, ... unique
    - citation_key        # may be blank at discovery
    - title               # real, copied from source
    - authors             # surname list
    - year
    - source              # journal / NBER / SSRN / arXiv / publisher
    - doi                 # DOI or blank
    - url                 # resolvable URL or blank (doi OR url required)
    - pdf_url             # may be blank
    - primary_function    # one of: idea-inspiring | gap-verification | method-identification | data-measurement | background-institutional | theory-mechanism
    - secondary_functions # ';'-separated subset of the same vocabulary, or blank
    - reading_depth       # discovery default: skim  (allowed: skim|abstract|targeted|full_text|not_read)
    - status              # discovery default: discovered  (do not exceed title_abstract_screened)
    - full_text_available # no
    - opened_source       # blank at discovery
    - opened_date         # blank at discovery
    - evidence_basis      # title OR abstract  (NOT full_text / extraction_card)
    - screening_decision  # maybe | defer | exclude  (NOT include at discovery)
    - extraction_card     # no
    - used_in_synthesis   # no
    - notes

checks:
  - check_literature_registry.py
  - check_citation_audit.py
  - check_literature_functions.py

retry_policy:
  max_retries: 2

escalate_if:
  - "fewer than 5 valid papers registered"
  - "checks still fail after max_retries"

budget:
  max_agent_calls: 3
  max_dollars: 2.0
