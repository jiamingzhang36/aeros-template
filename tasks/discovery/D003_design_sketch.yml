task_id: D003_design_sketch
stage: discovery
gate: G3
goal: >
  Converge the framing deck, the data inventory, and the gap into ONE concrete
  candidate research design, written to discovery/design_sketch.md. This is a
  provisional sketch, NOT the protected method card. Reason from what already
  exists; do not invent new literature or data.

  Read discovery/literature/framing_deck.yml (frameworks + their role/caveat),
  discovery/data_inventory.csv (candidate sources), and the gap-verification
  rows in paper_registry.csv. Produce design_sketch.md with this front matter:

    ---
    status: filled
    project_type: causal        # causal | descriptive | measurement | prediction |
                                #   policy-translation | mechanism | replication
    claim_type: "..."           # the claim class this design could support
    unit_of_analysis: "..."
    grounded_data_ids: [D002, D007]   # data_inventory ids the design relies on (must exist)
    addresses_threats: [F06]          # framing identification-threat card ids the design addresses
    ---

  and these sections, each grounded:
    ## Research Question
    ## Project Type        (justify the class; do not call it causal without identifying variation)
    ## Unit of Analysis
    ## Treatment / Exposure
    ## Outcome
    ## Identification Strategy   (name the estimator/design; cite the relevant framing method card, e.g. F04)
    ## Threats to Validity       (address EVERY framing identification-threat card, e.g. F06 diffusion timing)
    ## Candidate Data            (map each variable to a specific data_inventory source by data_id)
    ## Minimum Viable Version    (the smallest credible version)
    ## Claim Boundary            (what this design CAN and CANNOT claim)

inputs:
  - discovery/literature/framing_deck.yml
  - discovery/data_inventory.csv
  - discovery/literature/paper_registry.csv
  - discovery/idea_memo.md
  - project_manifest.yml

allowed_outputs:
  - discovery/design_sketch.md

forbidden_actions:
  - "Do not write anywhere under data/raw/ (enforced by a hook)."
  - "Do not invent new literature or data sources; ground the design in the framing deck and data_inventory that already exist."
  - "Do not call the design 'causal' unless you name plausible identifying variation and address the framing's identification-threat cards."
  - "Do not treat this sketch as the protected method card; it is provisional."
  - "Do not overstate the claim boundary; state explicitly what the design CANNOT claim."

checks:
  - check_design_sketch.py

retry_policy:
  max_retries: 2

escalate_if:
  - "an identification-threat card from the framing deck is not addressed"
  - "checks still fail after max_retries"

budget:
  max_agent_calls: 3
  max_dollars: 3.0
