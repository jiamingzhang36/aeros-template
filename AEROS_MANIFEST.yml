project:
  name: "AEROS project"
  version: "0.1"
  template: "aeros-template"
  status: "draft"
  private_by_default: true

research:
  field_or_domain: ""
  topic: ""
  one_sentence_question: ""
  current_stage: "discovery"
  human_owner: ""
  collaborators: []

layers:
  research_judgment:
    required_files:
      - "0_discovery/00_idea_note.md"
      - "0_discovery/08_gap_memo.md"
      - "0_discovery/09_feasibility_memo.md"
      - "1_design/method_card.md"
      - "3_evidence/claim_registry.md"
      - "6_decisions/decision_log.md"
  agent_execution:
    required_dirs:
      - "2_execution/tasks"
      - "4_agent_runs"
      - "5_audits"
  mechanical_verification:
    required_dirs:
      - "2_execution/checks"

protected_files:
  - "1_design/protected_definitions.yml"
  - "1_design/data_contract.yml"
  - "3_evidence/claim_registry.md"

never_modify_without_human_approval:
  - "2_execution/data/raw/"
  - "1_design/protected_definitions.yml"

default_task_policy:
  raw_data_write_access: false
  protected_definition_changes: "requires explicit human approval"
  claim_strengthening: "requires evidence and claim registry update"
  preferred_spec_selection: "must not be based on significance alone"

checks:
  no_raw_data_changes: "2_execution/checks/check_no_raw_data_changes.py"
  protected_definitions: "2_execution/checks/check_protected_definitions.py"
  claim_registry: "2_execution/checks/check_claim_registry.py"
  paper_numbers: "2_execution/checks/check_paper_numbers.py"
