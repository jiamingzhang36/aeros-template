[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeros-runtime"
version = "0.0.1"
description = "A thin orchestrator that runs empirical-research task contracts through an agent under mechanical checks and permission hooks."
readme = "aeros/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
aeros = "aeros.cli:main"

[tool.setuptools.packages.find]
# Package every runtime namespace used by the CLI (including kernel and
# paper_ci). The surrounding project scaffold remains outside the wheel.
include = ["aeros*"]
